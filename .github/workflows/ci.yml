name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Test and lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dorm_management_test
          POSTGRES_USER: dorm
          POSTGRES_PASSWORD: dorm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dorm -d dorm_management_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://dorm:dorm@localhost:5432/dorm_management_test
      TEST_DATABASE_URL: postgresql+psycopg://dorm:dorm@localhost:5432/dorm_management_test
      ENVIRONMENT: test
      JWT_SECRET_KEY: ci-only-secret-not-used-outside-github-actions

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run test suite
        run: pytest

      - name: Run Ruff
        run: ruff check .
