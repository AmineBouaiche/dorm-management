<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard | Residence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
</head>
<body>
  <div data-primary-navigation></div>
  <main class="page" data-dashboard-page hidden>
    <div class="container">
      <header class="page-header">
        <h1>Dashboard</h1>
        <p class="page-header__description" data-welcome>Manage your accommodation and booking.</p>
      </header>

      <section>
        <div class="section-heading"><span class="eyebrow">Current accommodation</span></div>
        <div data-dashboard-booking aria-live="polite">
          <div class="panel stack"><div class="skeleton skeleton--line"></div><div class="skeleton skeleton--line"></div><div class="skeleton skeleton--line"></div></div>
        </div>
      </section>

      <section class="section">
        <h2>Quick access</h2>
        <div class="grid grid--2 quick-access-grid">
          <article class="panel quick-access-card">
            <h3>Find accommodation</h3>
            <p class="text-secondary">Browse available rooms for your selected dates.</p>
            <a class="text-link" href="/rooms">Browse rooms</a>
          </article>
          <article class="panel quick-access-card">
            <h3>My bookings</h3>
            <p class="text-secondary">Review current and previous accommodation bookings.</p>
            <a class="text-link" href="/bookings">View bookings</a>
          </article>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="/static/js/pages/dashboard.js"></script>
</body>
</html>
