<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create account | Residence</title>
    <link rel="stylesheet" href="/static/css/tokens.css" />
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/layout.css" />
    <link rel="stylesheet" href="/static/css/components.css" />
    <link rel="stylesheet" href="/static/css/auth.css" />
  </head>
  <body>
    <main class="auth-shell auth-shell--wide">
      <section class="auth-panel auth-panel--wide" aria-labelledby="register-title">
        <a class="wordmark auth-panel__wordmark" href="/">Residence</a>
        <div class="auth-panel__header">
          <h1 id="register-title">Create your account</h1>
          <p>Register to manage your accommodation.</p>
        </div>

        <div class="message message--error" data-form-message role="alert" hidden></div>

        <form class="stack" data-register-form novalidate>
          <div class="auth-form-grid">
            <div class="field">
              <label class="field__label" for="first_name">First name</label>
              <input class="input" id="first_name" name="first_name" autocomplete="given-name" aria-describedby="first-name-error" required />
              <p class="field__error" id="first-name-error" data-error-for="first_name" hidden></p>
            </div>
            <div class="field">
              <label class="field__label" for="last_name">Last name</label>
              <input class="input" id="last_name" name="last_name" autocomplete="family-name" aria-describedby="last-name-error" required />
              <p class="field__error" id="last-name-error" data-error-for="last_name" hidden></p>
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="student_id">Student ID</label>
            <input class="input" id="student_id" name="student_id" autocomplete="off" aria-describedby="student-id-error" required />
            <p class="field__error" id="student-id-error" data-error-for="student_id" hidden></p>
          </div>

          <div class="field">
            <label class="field__label" for="email">Email address</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error" required />
            <p class="field__error" id="email-error" data-error-for="email" hidden></p>
          </div>

          <div class="field">
            <label class="field__label" for="password">Password</label>
            <div class="password-control">
              <input class="input" id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-hint password-error" required />
              <button class="password-control__toggle" type="button" data-password-toggle data-target="password">Show</button>
            </div>
            <p class="field__hint" id="password-hint">Use at least 8 characters.</p>
            <p class="field__error" id="password-error" data-error-for="password" hidden></p>
          </div>

          <div class="field">
            <label class="field__label" for="confirm_password">Confirm password</label>
            <div class="password-control">
              <input class="input" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" aria-describedby="confirm-password-error" required />
              <button class="password-control__toggle" type="button" data-password-toggle data-target="confirm_password">Show</button>
            </div>
            <p class="field__error" id="confirm-password-error" data-error-for="confirm_password" hidden></p>
          </div>

          <button class="button button--primary auth-submit" type="submit">Create account</button>
        </form>

        <p class="auth-panel__footer">Already have an account? <a href="/login">Sign in</a></p>
      </section>
    </main>
    <script type="module" src="/static/js/pages/register.js"></script>
    <script type="module" src="/static/js/pages/password-toggle.js"></script>
  </body>
</html>
