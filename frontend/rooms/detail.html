<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Room details | Residence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/tokens.css" /><link rel="stylesheet" href="/static/css/base.css" /><link rel="stylesheet" href="/static/css/layout.css" /><link rel="stylesheet" href="/static/css/components.css" />
</head>
<body>
  <div data-primary-navigation></div>
  <main class="page" data-room-detail-page hidden>
    <div class="container">
      <p><a class="text-link" href="/rooms">Rooms</a> / <span data-breadcrumb-residence></span> / <span data-breadcrumb-room></span></p>
      <header class="page-header"><p class="card__eyebrow" data-building-name></p><h1 data-room-name>Room</h1></header>
      <img class="room-detail__image" data-building-image alt="" />
      <div class="split section">
        <section>
          <h2>Room information</h2>
          <dl class="detail-list">
            <dt>Room type</dt><dd data-room-type></dd>
            <dt>Capacity</dt><dd data-capacity></dd>
            <dt>Residence</dt><dd data-residence></dd>
            <dt>Address</dt><dd data-address></dd>
            <dt>Weekly rate</dt><dd data-weekly-rate></dd>
          </dl>
        </section>
        <aside class="panel booking-panel">
          <h2>Your stay</h2>
          <div class="stack" data-stay-summary>
            <p class="field__hint">Choose arrival and departure dates on the Rooms page to confirm availability and estimate the total.</p>
          </div>
          <div class="stack room-detail__actions">
            <a class="button button--primary" href="/rooms" data-book-action>Choose dates</a>
          </div>
        </aside>
      </div>
    </div>
  </main>
  <div class="container page" data-room-detail-error hidden><div class="message message--error"><strong>We couldn't load this room.</strong><p data-detail-error-text></p><a class="button button--secondary" href="/rooms">Back to rooms</a></div></div>
  <script type="module" src="/static/js/pages/room-detail.js"></script>
</body>
</html>
