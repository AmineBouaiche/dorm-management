services:
  db:
    image: postgres:17-alpine
    container_name: dorm-management-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dorm_management
      POSTGRES_USER: dorm
      POSTGRES_PASSWORD: dorm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dorm -d dorm_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dorm-management-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://dorm:dorm@db:5432/dorm_management
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY to a strong production test secret}
      PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  db_test:
    image: postgres:17-alpine
    container_name: dorm-management-test-db
    environment:
      POSTGRES_DB: dorm_management_test
      POSTGRES_USER: dorm
      POSTGRES_PASSWORD: dorm
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dorm -d dorm_management_test"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
