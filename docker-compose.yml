services:
  db:
    image: postgres:17-alpine
    container_name: dorm-management-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dorm_management
      POSTGRES_USER: dorm
      POSTGRES_PASSWORD: dorm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dorm -d dorm_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_test:
    image: postgres:17-alpine
    container_name: dorm-management-test-db
    environment:
      POSTGRES_DB: dorm_management_test
      POSTGRES_USER: dorm
      POSTGRES_PASSWORD: dorm
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dorm -d dorm_management_test"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
